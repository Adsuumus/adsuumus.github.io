<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Maya</title>
    <link rel="icon" href="./maya/maya.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="header">
      <img src="./maya/maya.webp" alt="" class="icon" />
      <div class="buttons-container">Log</div>
    </div>
    <div
      id="typograph-container"
      contenteditable="true"
      spellcheck="false"
      autocorrect="off"
      class="text-container"
      style="
        background: transparent !important;
        background-color: transparent !important;
        box-shadow: none !important;
      "
    ></div>
    <!-- <script src="./maya/beautify-html.min.js"></script> -->
    <script>
      window.addEventListener("load", () => {
        const editableDiv = document.getElementById("typograph-container");
        editableDiv.focus();
        const info = getScreenInfo();

        editableDiv.textContent = `Screen: ${info.screen.width}×${info.screen.height}
Viewport: ${info.viewport.width}×${info.viewport.height}
DPR: ${info.devicePixelRatio}
`;
      });

      const getScreenInfo = () => ({
        screen: {
          width: screen.width,
          height: screen.height,
          availWidth: screen.availWidth,
          availHeight: screen.availHeight,
          colorDepth: screen.colorDepth,
        },
        viewport: {
          width: window.innerWidth,
          height: window.innerHeight,
        },
        window: {
          outerWidth: window.outerWidth,
          outerHeight: window.outerHeight,
        },
        devicePixelRatio: window.devicePixelRatio,
        orientation: screen.orientation?.type,
      });

      document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById("typograph-container");

        if (container) {
          container.style.cursor = "pointer";

          container.addEventListener("click", async () => {
            const textToCopy = container.textContent;

            try {
              await navigator.clipboard.writeText(textToCopy);

              const msg = document.createElement("div");
              msg.textContent = "Скопировано!";
              msg.style.cssText = `
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #4caf50;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 1000;
            animation: fadeOut 2s forwards;
          `;

              document.body.appendChild(msg);

              setTimeout(() => msg.remove(), 2000);
            } catch (err) {
              console.error("Ошибка:", err);
              alert("Не удалось скопировать");
            }
          });
        }
      });
    </script>
  </body>
</html>
